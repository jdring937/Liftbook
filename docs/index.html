pace of weight change matters: about 0.5\u20131% of bodyweight a week when losing and 0.25\u20130.5% when gaining helps keep muscle and limit fat gain.",app:"Your main goal sets the rep ranges for exercises you add to a workout (Get stronger: compound lifts 3\u20136, isolation 8\u201312; Get big and Get big and ripped: 6\u201310 and 10\u201315; the others: 8\u201312 and 10\u201315; these exact ranges are the app\u2019s choices within the evidence), rest in Evidence mode (Get stronger gives compound lifts at least 2:30), how weekly coverage describes 4\u20139 sets, and which pace of weight change the app checks you against, including a tip on Train and Progress when your bodyweight trend runs the wrong way or too fast. Without a goal the app behaves like General well-being.",where:"Asked once when you first open the app; Settings \u2192 Main goal; Progress \u2192 Goals",setting:"goal",refs:[{cite:"Currier BS, D\u2019Souza AC, Fiatarone Singh MA, et al. (2026). ACSM Position Stand. Resistance Training Prescription for Muscle Function, Hypertrophy, and Physical Performance in Healthy Adults: An Overview of Reviews. Med Sci Sports Exerc 58(4):851\u2013872.",url:Y("10.1249/MSS.0000000000003897")},{cite:"Lopez P, Radaelli R, Taaffe DR, et al. (2021). Resistance Training Load Effects on Muscle Hypertrophy and Strength Gain: Systematic Review and Network Meta-analysis. Med Sci Sports Exerc 53(6):1206\u20131216.",url:Y("10.1249/MSS.0000000000002585")},{cite:"Pelland JC, Remmert JF, Robinson ZP, et al. (2026). The Resistance Training Dose Response: Meta-Regressions Exploring the Effects of Weekly Volume and Frequency on Muscle Hypertrophy and Strength Gains. Sports Med 56(2):481\u2013505.",url:Y("10.1007/s40279-025-02344-w")},{cite:"Grgic J, Schoenfeld BJ, Skrepnik M, Davies TB, Mikulic P (2018). Effects of Rest Interval Duration in Resistance Training on Measures of Muscular Strength: A Systematic Review. Sports Med 48(1):137\u2013151.",url:Y("10.1007/s40279-017-0788-x")},{cite:"Helms ER, Aragon AA, Fitschen PJ (2014). Evidence-based recommendations for natural bodybuilding contest preparation: nutrition and supplementation. J Int Soc Sports Nutr 11:20.",url:Y("10.1186/1550-2783-11-20")},{cite:"Iraki J, Fitschen P, Espinar S, Helms E (2019). Nutrition Recommendations for Bodybuilders in the Off-Season: A Narrative Review. Sports 7(7):154.",url:Y("10.3390/sports7070154")}]},volume:{title:"Weekly sets per muscle",summary:"Muscle growth tends to rise with the number of hard sets per muscle each week, with diminishing returns. Around 10\u201320 weekly sets is a common target, and the 2026 ACSM position stand recommends at least 10 for growth. Strength needs fewer sets.",app:"Every set you log counts 1 for the exercise\u2019s main muscles and 0.5 for its helpers, the \u201Cfractional\u201D method that fit the data best in the 2026 meta-regression. The muscle map and weekly coverage use the same bands: under 4 low, 4\u20139 moderate, 10\u201320 typical growth range, over 20 diminishing returns.",where:"Progress \u2192 Muscles; Plans \u2192 any workout or program \u2192 Weekly coverage; the import review; muscle-set goals",refs:[{cite:"Schoenfeld BJ, Ogborn D, Krieger JW (2017). Dose-response relationship between weekly resistance training volume and increases in muscle mass: a systematic review and meta-analysis. J Sports Sci 35(11):1073\u20131082.",url:Y("10.1080/02640414.2016.1210197")},{cite:"Pelland JC, Remmert JF, Robinson ZP, et al. (2026). The Resistance Training Dose Response: Meta-Regressions Exploring the Effects of Weekly Volume and Frequency on Muscle Hypertrophy and Strength Gains. Sports Med 56(2):481\u2013505.",url:Y("10.1007/s40279-025-02344-w")},{cite:"Currier BS, D\u2019Souza AC, Fiatarone Singh MA, et al. (2026). ACSM Position Stand. Resistance Training Prescription for Muscle Function, Hypertrophy, and Physical Performance in Healthy Adults: An Overview of Reviews. Med Sci Sports Exerc 58(4):851\u2013872.",url:Y("10.1249/MSS.0000000000003897")}]},frequency:{title:"How often to train a muscle",summary:"When weekly sets are matched, training a muscle more often makes little difference to growth. Weekly sets matter more than how you split them. Twice a week per muscle is a practical default, and more frequent practice may help strength a little.",app:"Weekly coverage shows how many days a week each muscle is a main target (the Days column), and for programs notes major muscles with 10+ weekly sets that get them all on one day, as information rather than a warning.",where:"Weekly coverage \u2192 Show all muscles (Days column)",refs:[{cite:"Schoenfeld BJ, Grgic J, Krieger JW (2019). How many times per week should a muscle be trained to maximize muscle hypertrophy? A systematic review and meta-analysis. J Sports Sci 37(11):1286\u20131295.",url:Y("10.1080/02640414.2018.1555906")},{cite:"Grgic J, Schoenfeld BJ, Davies TB, et al. (2018). Effect of Resistance Training Frequency on Gains in Muscular Strength: A Systematic Review and Meta-Analysis. Sports Med 48(5):1207\u20131220.",url:Y("10.1007/s40279-018-0872-x")},{cite:"Currier BS, et al. (2026). ACSM Position Stand (see above): at least 2 sessions a week covering all major muscle groups.",url:Y("10.1249/MSS.0000000000003897")}]},rest:{title:"Rest between sets",summary:"It depends on how heavy the sets are. For muscle growth, ACSM recommends 1\u20132 minutes, and a 2024 meta-analysis found a small benefit from resting more than about 60 seconds but no clear extra benefit past about 90 seconds. For heavy sets aimed at strength, ACSM recommends 3\u20135 minutes for intermediate and advanced lifters, and a systematic review found that resting more than 2 minutes is needed to get the most strength out of training in experienced lifters (60\u2013120 seconds was enough for beginners).",app:"With the rest timer on Evidence (the default), rest follows each exercise\u2019s rep target: 6 reps or fewer counts as heavy and gets 3:00 (the low end of ACSM\u2019s 3\u20135 minutes, and over the 2 minutes from the strength review); anything else gets 1:30 (inside ACSM\u2019s 1\u20132 minutes and at the point past which growth stops improving). Timed holds get 1:00, the app\u2019s own choice. Exercises without a rep target get 1:30. With the Get stronger goal, compound lifts get at least 2:30 and isolation work 1:30 (ACSM\u2019s 1\u20132 minutes for assistance exercises). A time you pick for an exercise always wins. Fit to time may shorten lighter sets to 1:15 (still over 60 seconds), won\u2019t cut heavy sets, or compound lifts when training for strength, below 2:30, and never changes a rest you picked.",where:"Settings \u2192 Rest timer; the timer after each set says why (for example \u201Cmuscle-building sets\u201D); exercise rest buttons show \u201CAuto\u201D",setting:"rest",refs:[{cite:"Ratamess NA, Alvar BA, Evetoch TK, et al. (2009). ACSM Position Stand. Progression Models in Resistance Training for Healthy Adults. Med Sci Sports Exerc 41(3):687\u2013708. (3\u20135 min between heavy sets for strength; 1\u20132 min for hypertrophy.)",url:Y("10.1249/MSS.0b013e3181915670")},{cite:"Singer A, Wolf M, Generoso L, et al. (2024). Give it a rest: a systematic review with Bayesian meta-analysis on the effect of inter-set rest interval duration on muscle hypertrophy. Front Sports Act Living 6:1429789.",url:Y("10.3389/fspor.2024.1429789")},{cite:"Grgic J, Schoenfeld BJ, Skrepnik M, Davies TB, Mikulic P (2018). Effects of Rest Interval Duration in Resistance Training on Measures of Muscular Strength: A Systematic Review. Sports Med 48(1):137\u2013151.",url:Y("10.1007/s40279-017-0788-x")},{cite:"Schoenfeld BJ, Pope ZK, Benik FM, et al. (2016). Longer Interset Rest Periods Enhance Muscle Strength and Hypertrophy in Resistance-Trained Men. J Strength Cond Res 30(7):1805\u20131812.",url:Y("10.1519/JSC.0000000000001272")}]},timeEfficient:{title:"Training when short on time",summary:"A review of time-efficient training recommends prioritising multi-joint lifts (at least a squat or leg press, an upper-body push and an upper-body pull), doing at least 4 hard sets per muscle per week, and remembering that weekly volume matters more than frequency. Supersets and similar techniques can roughly halve session time.",app:"Fit to time protects compound lifts longest, in line with the review\u2019s priority on multi-joint exercises. The rest of the trimming order is the app\u2019s own rule of thumb: shorten rest on lighter sets (to no less than 1:15) and heavy sets (to no less than 2:30), leaving rests you picked alone, drop accessories that repeat a muscle already trained that session, then trim accessory sets before compound sets.",where:"Train \u2192 tap a workout \u2192 Short on time? Fit it in (also under your program\u2019s next day)",refs:[{cite:"Iversen VM, Norum M, Schoenfeld BJ, Fimland MS (2021). No Time to Lift? Designing Time-Efficient Training Programs for Strength and Hypertrophy: A Narrative Review. Sports Med 51(10):2079\u20132095.",url:Y("10.1007/s40279-021-01490-1")}]},sets:{title:"One set or several",summary:"Two to three sets per exercise usually beat a single set for both size and strength, but a single hard set still produces real gains when time is short.",app:"Fit to time keeps at least 2 sets on compound lifts where it can, and only drops to 1 set when the time budget is very tight.",where:"Train \u2192 tap a workout \u2192 Short on time? Fit it in",refs:[{cite:"Krieger JW (2010). Single vs. multiple sets of resistance exercise for muscle hypertrophy: a meta-analysis. J Strength Cond Res 24(4):1150\u20131159.",url:Y("10.1519/JSC.0b013e3181d4d436")},{cite:"Krieger JW (2009). Single versus multiple sets of resistance exercise: a meta-regression. J Strength Cond Res 23(6):1890\u20131901.",url:Y("10.1519/JSC.0b013e3181b370be")}]},load:{title:"Heavy or light weights",summary:"You can build muscle across a wide rep range when sets are taken close to failure. Heavier loads build more maximal strength.",app:"Rep ranges in your saved workouts can be anything that suits you, and start from your main goal. Targets add weight once you reach the top of your range (two sessions in a row with Evidence weight jumps).",where:"Plans \u2192 a workout \u2192 each exercise\u2019s rep range; workout targets",refs:[{cite:"Lopez P, Radaelli R, Taaffe DR, et al. (2021). Resistance Training Load Effects on Muscle Hypertrophy and Strength Gain: Systematic Review and Network Meta-analysis. Med Sci Sports Exerc 53(6):1206\u20131216.",url:Y("10.1249/MSS.0000000000002585")},{cite:"Schoenfeld BJ, Grgic J, Ogborn D, Krieger JW (2017). Strength and Hypertrophy Adaptations Between Low- vs. High-Load Resistance Training: A Systematic Review and Meta-analysis. J Strength Cond Res 31(12):3508\u20133523.",url:Y("10.1519/JSC.0000000000002200")}]},failure:{title:"How close to failure",summary:"Muscle growth tends to increase as sets end closer to failure, though going all the way to failure doesn\u2019t add more. Strength gains are similar across a wide range of effort. Stopping with about 0\u20133 reps left is a common recommendation.",app:"With effort rating on, each target suggests finishing sets with 1\u20133 reps left (RPE 7\u20139). Deload weeks set targets about 3 reps fewer than last time, to stay further from failure.",where:"Workout targets when effort rating is on; deload weeks",refs:[{cite:"Robinson ZP, Pelland JC, Remmert JF, et al. (2024). Exploring the Dose\u2013Response Relationship Between Estimated Resistance Training Proximity to Failure, Strength Gain, and Muscle Hypertrophy: A Series of Meta-Regressions. Sports Med 54(9):2209\u20132231.",url:Y("10.1007/s40279-024-02069-2")},{cite:"Refalo MC, Helms ER, Trexler ET, et al. (2023). Influence of Resistance Training Proximity-to-Failure on Skeletal Muscle Hypertrophy: A Systematic Review with Meta-analysis. Sports Med 53(3):649\u2013665.",url:Y("10.1007/s40279-022-01784-y")}]},deload:{title:"Deloads",summary:"An international expert consensus defines a deload as a period of reduced training stress to manage fatigue and prepare for more training. Experts agreed on reducing volume (fewer sets) and training further from failure; load can stay similar or come down. No fixed interval was agreed: deloads can be planned into each training block or taken when fatigue builds. In one trial, a full week off mid-programme didn\u2019t change muscle growth and slightly blunted lower-body strength gains.",app:"When two or more lifts trend down at once, or one does after 6+ straight weeks of training, the app suggests a deload week. Deload mode halves your sets for 7 days and keeps your usual weights, with targets about 3 reps fewer than last time so you stop short of failure. Deload sessions don\u2019t count toward targets or lift trends afterwards, so a lighter week isn\u2019t mistaken for lost strength.",where:"Tips on Train and Progress \u2192 Goals; workout targets during a deload week",refs:[{cite:"Bell L, Strafford BW, Coleman M, et al. (2023). Integrating Deloading into Strength and Physique Sports Training Programmes: An International Delphi Consensus Approach. Sports Med Open 9:87.",url:Y("10.1186/s40798-023-00633-0")},{cite:"Coleman M, Burke R, Augustin F, et al. (2024). Gaining more from doing less? The effects of a one-week deload period during supervised resistance training on muscular adaptations. PeerJ 12:e16777.",url:Y("10.7717/peerj.16777")}]},trend:{title:"Spotting a decline or a stall",summary:"Single sessions are noisy: sleep, food and stress move performance from day to day. A lift is only flagged as declining when its estimated 1RM sits clearly below its recent best for several sessions in a row, and as stalled when it hasn\u2019t beaten its best for about four weeks. These cut-offs are rules of thumb, not tested thresholds.",app:"Declining: the last 3 sessions all at least 3% below the best of the 6 weeks before them. Stalled: no new best (beating it by more than 1%) for 4+ weeks, with at least 3 sessions since that best. Several declining lifts at once may point to general fatigue rather than one lift.",where:"Tips on Train and Progress \u2192 Goals; the trend line at the top of each exercise\u2019s page",refs:[{cite:"Bell L, et al. (2023). Deloading Delphi consensus (see Deloads): deloads can be pre-planned or used in response to signs of fatigue.",url:Y("10.1186/s40798-023-00633-0")}]},variation:{title:"Changing exercises",summary:"Planned, occasional exercise variation is fine and may help some regions of a muscle grow, while constant random switching may slow progress. Swapping an exercise or rep range when you stall is common coaching practice, not a proven rule.",app:"Stalled lifts get a suggestion to try a different rep range or a close variation for a few weeks.",where:"Stalled-lift tips on Train and Progress \u2192 Goals",refs:[{cite:"Kassiano W, Nunes JP, Costa B, et al. (2022). Does Varying Resistance Exercises Promote Superior Muscle Hypertrophy and Strength Gains? A Systematic Review. J Strength Cond Res 36(6):1753\u20131762.",url:Y("10.1519/JSC.0000000000004258")}]},progression:{title:"When to add weight",summary:"ACSM\u2019s progression guidance: once you can do 1\u20132 reps more than your target in two sessions in a row, add about 2\u201310% load (less for small muscle groups, more for large ones). The 2026 position stand recommends progressive training, noting overload matters most for continued long-term progress.",app:"Targets use double progression: a rep more each session until every set reaches the top of your rep range, then a weight jump and back to the bottom of the range. With weight jumps on Evidence (the default), the jump follows ACSM: it comes after you reach the top of the range on every set in two sessions in a row, and it\u2019s about 5% of the working weight for lower-body compound lifts and 2.5% for everything else (the app\u2019s choice within ACSM\u2019s 2\u201310%), rounded to your smallest step. It\u2019s never less than one step, so light lifts can jump more than 10%; the target says so, and a smaller step in Settings avoids it. Fixed adds the same jump after a single session. If you rate effort and your reps plus reps left reach the top of the range with 2+ to spare, the jump comes after one session (an app rule of thumb). Bodyweight exercises add a rep each session up to the top of the range, then suggest added weight or a harder variation.",where:"Workout targets (an \u201Cup\u201D target shows the jump as a %); Settings \u2192 Weight jumps",setting:"progression",refs:[{cite:"Ratamess NA, Alvar BA, Evetoch TK, et al. (2009). ACSM Position Stand. Progression Models in Resistance Training for Healthy Adults. Med Sci Sports Exerc 41(3):687\u2013708.",url:Y("10.1249/MSS.0b013e3181915670")},{cite:"Currier BS, et al. (2026). ACSM Position Stand (see Weekly sets).",url:Y("10.1249/MSS.0000000000003897")}]},e1rm:{title:"Estimated 1RM",summary:"Formulas like Brzycki and Epley estimate your one-rep max from a set of several reps. They are approximations; a common rule of thumb is that they\u2019re more reliable from lower-rep sets (about 10 or fewer). In one study of untrained students, every common equation underestimated the deadlift.",app:"Estimates use your best set each session from sets of 12 reps or fewer, a little past the 10-rep rule of thumb so the common 8\u201312 rep sets still count. Higher-rep sets, including isolation sets of 13\u201315 at the top of the default range, don\u2019t get an estimate, and sessions without one are left off the chart. Forecasts use the trend in these estimates, not any single session.",where:"Exercise pages, lift goals and personal records",refs:[{cite:"LeSuer DA, McCormick JH, Mayhew JL, et al. (1997). The Accuracy of Prediction Equations for Estimating 1-RM Performance in the Bench Press, Squat, and Deadlift. J Strength Cond Res 11(4):211\u2013213.",url:Y("10.1519/00124278-199711000-00001")}]},weightRate:{title:"How fast to change bodyweight",summary:"When losing weight, about 0.5\u20131% of bodyweight per week helps keep muscle; in elite athletes, a slower target kept lean mass better than a faster one. When gaining, about 0.25\u20130.5% per week limits fat gain for most lifters, slower for advanced lifters.",app:"Bodyweight goals show the weekly rate your goal needs and flag it if it\u2019s faster than these ranges. The Weight page shows your last 4 weeks\u2019 rate against them too.",where:"Body \u2192 Weight; bodyweight goals",refs:[{cite:"Helms ER, Aragon AA, Fitschen PJ (2014). Evidence-based recommendations for natural bodybuilding contest preparation: nutrition and supplementation. J Int Soc Sports Nutr 11:20.",url:Y("10.1186/1550-2783-11-20")},{cite:"Garthe I, Raastad T, Refsnes PE, et al. (2011). Effect of two different weight-loss rates on body composition and strength and power-related performance in elite athletes. Int J Sport Nutr Exerc Metab 21(2):97\u2013104.",url:Y("10.1123/ijsnem.21.2.97")},{cite:"Iraki J, Fitschen P, Espinar S, Helms E (2019). Nutrition Recommendations for Bodybuilders in the Off-Season: A Narrative Review. Sports 7(7):154.",url:Y("10.3390/sports7070154")}]},weighTrend:{title:"Reading bodyweight",summary:"Weight moves day to day with water, food and salt, and tends to rise over weekends and fall during the week. A smoothed trend tells you more than any single weigh-in. Smoothing is a sensible practice rather than a tested rule.",app:"Each weigh-in is a dot; the line is a time-weighted moving average with about a week\u2019s memory. The 4-week rate and bodyweight forecasts use that line, not single weigh-ins.",where:"Body \u2192 Weight; bodyweight goals",refs:[{cite:"Orsama AL, Mattila E, Ermes M, et al. (2014). Weight Rhythms: Weight Increases during Weekends and Decreases during Weekdays. Obes Facts 7(1):36\u201347.",url:Y("10.1159/000356147")}]},balance:{title:"Muscle balance",summary:"Balanced pushing and pulling, and training both the front and back of the thigh, are sensible rules of thumb, but research hasn\u2019t established an ideal volume ratio. Hamstring-to-quadriceps strength ratios (around 0.6 is a common norm) have shown very limited ability to predict injury.",app:"Coverage points out when one side gets more than twice the sets of the other. Treat it as a prompt to think, not a rule.",where:"Weekly coverage",refs:[{cite:"Kellis E, Sahinis C, Baltzopoulos V (2023). Is hamstrings-to-quadriceps torque ratio useful for predicting anterior cruciate ligament and hamstring injuries? A systematic and critical review. J Sport Health Sci 12(3):343\u2013358.",url:Y("10.1016/j.jshs.2022.01.002")}]},effort:{title:"Rating effort (RIR and RPE)",summary:"Reps in reserve (RIR) is how many more reps you could have done. The RIR-based RPE scale maps RPE 10 to no reps left, RPE 9 to one left, and so on. In a meta-analysis, people underestimated their reps left by about one on average, and were a little more accurate closer to failure and on sets under about 12 reps.",app:"Effort is optional. When you log it, estimated 1RM uses your reps plus reps left (reps left capped at 5, and never past 12 reps in total), so an easier day doesn\u2019t look like lost strength. If your reps plus reps left reach the top of your rep range with at least 2 left on every top set (or 3+ left when the exercise has no range), the next target adds weight after one session, an app rule of thumb. Targets also suggest finishing with 1\u20133 reps left. RPE is stored as reps left, so RPE 8 = 2 left.",where:"Settings \u2192 Rate effort; the toggle at the bottom of every workout; Plans \u2192 a workout \u2192 Rate effort",setting:"effort",refs:[{cite:"Zourdos MC, Klemp A, Dolan C, et al. (2016). Novel Resistance Training\u2013Specific Rating of Perceived Exertion Scale Measuring Repetitions in Reserve. J Strength Cond Res 30(1):267\u2013275.",url:Y("10.1519/JSC.0000000000001049")},{cite:"Helms ER, Cronin J, Storey A, Zourdos MC (2016). Application of the Repetitions in Reserve-Based Rating of Perceived Exertion Scale for Resistance Training. Strength Cond J 38(4):42\u201349.",url:Y("10.1519/SSC.0000000000000218")},{cite:"Halperin I, Malleron T, Har-Nir I, et al. (2022). Accuracy in Predicting Repetitions to Task Failure in Resistance Exercise: A Scoping Review and Exploratory Meta-analysis. Sports Med 52(2):377\u2013390.",url:Y("10.1007/s40279-021-01559-x")}]},pain:{title:"Exercising with pain",summary:"In a trial of people with Achilles tendinopathy, continuing running and jumping guided by a pain-monitoring model did as well as stopping them for 6 weeks, with both groups doing the same rehab exercises. Pain was allowed up to 5/10 during activity, had to settle by the next morning, and could not get worse from week to week. The evidence is from Achilles rehab; persistent or worsening pain deserves a clinician\u2019s opinion.",app:"If you log pain on an exercise, the app flags ratings above 5/10 and pain that rises from one week to the next. It can\u2019t check next-morning pain, so check that yourself.",where:"Exercise menu \u2192 Pain or discomfort; the exercise\u2019s page; tips on Train",refs:[{cite:"Silbernagel KG, Thome\xE9 R, Eriksson BI, Karlsson J (2007). Continued sports activity, using a pain-monitoring model, during rehabilitation in patients with Achilles tendinopathy: a randomized controlled study. Am J Sports Med 35(6):897\u2013906.",url:Y("10.1177/0363546506298279")}]}},sr=["goal","volume","frequency","sets","load","failure","effort","rest","progression","timeEfficient","deload","trend","variation","e1rm","weightRate","weighTrend","balance","pain"];async function Rn(e){let s=new Image;s.decoding="async",s.src=typeof e=="string"?e:URL.createObjectURL(e);try{await s.decode()}catch{await new Promise((n,o)=>{s.onload=n,s.onerror=o})}return s}function ar(e,s=.85){return new Promise(a=>e.toBlob(n=>a(n),"image/jpeg",s))}function Ss(e,s,a,{max:n=1440,aspect:o=null,mirror:r=!1}={}){let
